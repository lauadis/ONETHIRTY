<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ONETHIRTY</title>
    <meta name="description" content="ONETHIRTY — Music & Events">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Social Preview -->
    <meta property="og:title" content="ONETHIRTY">
    <meta property="og:description" content="Music & Events">
    <meta property="og:image" content="https://onethirty.xyz/logo.png">
    <meta property="og:url" content="https://onethirty.xyz">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ONETHIRTY">
    <meta name="twitter:description" content="Music & Events">
    <meta name="twitter:image" content="https://onethirty.xyz/logo.png">

    <style>

        @font-face {
            font-family: "Druk";
            src: url("Druk Bold Regular.woff2") format("woff2");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo {
            width: min(75vw, 700px);
            height: auto;
            display: block;

            opacity: 0;
            animation: fadeIn 1.5s ease forwards;

            transition: transform 0.4s ease;
        }

        .logo:hover {
            transform: scale(1.025);
        }

        .coming-soon {
            margin-top: -10px;

            font-family: "Druk", sans-serif;
            font-size: clamp(20px, 2.2vw, 32px);
            font-weight: 700;
            letter-spacing: 0.02em;
            line-height: 1;

            color: #fff;

            opacity: 0;
            animation: fadeIn 1.5s ease forwards;
            animation-delay: 0.35s;
        }

        .instagram {
            display: block;
            margin-top: 18px;

            opacity: 0;
            animation: fadeIn 1.5s ease forwards;
            animation-delay: 0.65s;

            transition:
                transform 0.3s ease,
                opacity 0.3s ease;
        }

        .instagram img {
            display: block;
            width: 38px;
            height: 38px;
        }

        .instagram:hover {
            transform: scale(1.08);
            opacity: 0.8;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @media (max-width: 600px) {

            .logo {
                width: 88vw;
            }

            .coming-soon {
                font-size: 24px;
                margin-top: -5px;
            }

            .instagram {
                margin-top: 16px;
            }

            .instagram img {
                width: 34px;
                height: 34px;
            }
        }

    </style>
</head>

<body>

    <main class="hero">

        <video
            class="logo"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
        >
            <source src="logo.mp4" type="video/mp4">
        </video>

        <div class="coming-soon">
            COMING SOON
        </div>

        <a
            class="instagram"
            href="https://instagram.com/onethirty.us"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="ONETHIRTY on Instagram"
        >
            <img
                src="instagram.png"
                alt="Instagram"
            >
        </a>

    </main>

</body>
</html>
