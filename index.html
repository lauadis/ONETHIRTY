<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ONETHIRTY</title>
    <meta name="description" content="ONETHIRTY — Music & Events">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo {
            width: min(75vw, 700px);
            height: auto;
            display: block;
        }

        video {
            max-width: 100%;
        }
    </style>
</head>

<body>

    <video
        class="logo"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
    >
        <source src="logo.mp4" type="video/mp4">
    </video>

</body>
</html>
